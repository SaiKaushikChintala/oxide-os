[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
bootloader_api = "0.11.12"
uart_16550 = "0.8.0"
x86_64 = "0.15.2"
spin = "0.9"
lazy_static = { version = "1.5", features = ["spin_no_std"] }
linked_list_allocator = "0.10"
pic8259 = "0.10.1"
pc-keyboard = "0.7"
noto-sans-mono-bitmap = { version = "0.3", default-features = false, features = [
    "regular",
    "size_16",
    "unicode-basic-latin",
] }
